services:
  - type: web
    name: reveal-backend
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reveal-db
          property: connectionString
    autoDeploy: true

databases:
  - name: reveal-db
    databaseName: reveal_db
    user: reveal_user
    plan: starter
